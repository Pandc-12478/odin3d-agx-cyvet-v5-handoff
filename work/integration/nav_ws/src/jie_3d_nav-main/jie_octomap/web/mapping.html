<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Odin1 实时建图</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111923;color:#eef4f6;font:15px system-ui}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#1c2935}
main{display:grid;grid-template-columns:minmax(0,1fr) 290px;height:calc(100dvh - 55px)}
canvas{width:100%;height:100%;touch-action:none}aside{overflow:auto;padding:16px;background:#202e3a}
button,input{font:inherit}button{margin:4px 0;padding:10px;border:0;border-radius:7px;background:#59bcae;color:#082328;width:100%}
button:disabled{opacity:.45}button.stop{background:#d8776c}input{width:100%;padding:9px}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px}small{color:#bad0d2}
@media(max-width:700px){main{display:flex;flex-direction:column}#view{height:54dvh;flex:none}aside{flex:1}header{font-size:14px}}
</style>
</head>
<body>
<header><strong>Odin1 实时三维建图</strong><a href="./index.html" style="color:#7de4d5">导航页</a></header>
<main><canvas id="view"></canvas><aside>
<div id="status">连接中…</div>
<p><small>单指旋转，双指或滚轮缩放，右键平移</small></p>
<label>控制令牌<input id="token" type="password" autocomplete="off" placeholder="从 AGX ap_mapping/control.token 获取"></label>
<p id="action-status" role="status" aria-live="polite"></p>
<button data-action="start">开始建图</button><button data-action="save">保存地图</button><button class="stop" data-action="stop">安全停止</button>
<h3>地图文件</h3><div id="files">尚无</div><h3>操作与日志</h3><pre id="log"></pre>
</aside></main>
<script type="module" src="./mapping.js"></script>
</body></html>
